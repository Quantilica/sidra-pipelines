name        = "Sidra Standard Pipelines"
description = "Pipelines oficiais de referência para o motor sidra-sql, cobrindo Contas Nacionais, Preços, Indústria, Comércio, Serviços, Trabalho, Agropecuária e Florestal."
version     = "3.0.0"

[[pipeline]]
id          = "pib_municipal"
description = "PIB dos Municípios"
path        = "contas_nacionais/pib_municipal"

[[pipeline]]
id          = "ipp"
description = "IPP - Índice de Preços ao Produtor (categoria econômica, CNAE e grupos industriais)"
path        = "precos/ipp"

[[pipeline]]
id          = "sinapi"
description = "SINAPI - Custo médio m² e custo de projeto"
path        = "precos/sinapi"

[[pipeline]]
id          = "snipc"
description = "SNIPC - INPC, IPCA, IPCA-15 e união (inflação)"
path        = "precos/snipc"

[[pipeline]]
id          = "populacao"
description = "População - censo, contagem, estimativas e união"
path        = "populacao"

[[pipeline]]
id          = "pam"
description = "PAM - Produção Agrícola Municipal (lavouras permanentes e temporárias)"
path        = "agropecuaria/pam"

[[pipeline]]
id          = "ppm"
description = "PPM - Pesquisa Pecuária Municipal (rebanhos, produção e exploração)"
path        = "agropecuaria/ppm"

[[pipeline]]
id          = "pevs"
description = "PEVS - Produção da Extração Vegetal e Silvicultura (produção e área florestal)"
path        = "agropecuaria/pevs"

[[pipeline]]
id          = "abate"
description = "Abate - Bovinos, Suínos e Frangos Abatidos"
path        = "agropecuaria/abate"

[[pipeline]]
id          = "leite"
description = "Pesquisa Trimestral do Leite"
path        = "agropecuaria/leite"

[[pipeline]]
id          = "couro"
description = "Pesquisa Trimestral do Couro"
path        = "agropecuaria/couro"

[[pipeline]]
id          = "pog"
description = "POG - Pesquisa da Avicultura de Postura (Galinhas Poedeiras e Ovos)"
path        = "agropecuaria/pog"

[[pipeline]]
id          = "lspa"
description = "LSPA - Levantamento Sistemático da Produção Agrícola"
path        = "agropecuaria/lspa"

[[pipeline]]
id          = "estoques"
description = "Pesquisa de Estoques de Grãos"
path        = "agropecuaria/estoques"

[[pipeline]]
id          = "contas_nacionais_anual"
description = "Contas Nacionais Anuais (PIB, PIB per capita e deflator)"
path        = "contas_nacionais/anual"

[[pipeline]]
id          = "contas_nacionais_trimestral"
description = "Contas Nacionais Trimestrais (CNT)"
path        = "contas_nacionais/trimestral"

[[pipeline]]
id          = "pim_pf"
description = "PIM-PF - Produção Física Industrial (Brasil e regional)"
path        = "industria/pim-pf"

[[pipeline]]
id          = "pmc"
description = "PMC - Pesquisa Mensal do Comércio"
path        = "pmc"

[[pipeline]]
id          = "pms"
description = "PMS - Pesquisa Mensal de Serviços"
path        = "pms"

[[pipeline]]
id          = "pnadcm"
description = "PNAD Contínua Mensal - Mercado de Trabalho"
path        = "trabalho/pnadcm"
